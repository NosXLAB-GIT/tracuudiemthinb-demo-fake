<script>
// Biến lưu trữ mã captcha hiện tại
let captchaHienTai = "";

// Hàm tạo mã xác nhận tự động
function taoCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    captchaHienTai = "";
    // Lấy ngẫu nhiên 5 ký tự[cite: 2]
    for (let i = 0; i < 5; i++) {
        captchaHienTai += chars[Math.floor(Math.random() * chars.length)];
    }
    // Hiển thị mã lên giao diện[cite: 2]
    const display = document.getElementById("captchaText");
    if (display) {
        display.innerText = captchaHienTai;
    }
}

// Hàm xử lý tra cứu điểm[cite: 2]
function traCuu() {
    let sbd = document.getElementById("sbd").value.trim();
    let captcha = document.getElementById("captcha").value.trim();

    // Kiểm tra captcha không phân biệt hoa thường[cite: 2]
    if (captcha.toUpperCase() !== captchaHienTai.toUpperCase()) {
        alert("Sai mã xác nhận!");
        taoCaptcha(); // Đổi mã mới ngay khi sai
        return;
    }

    let kq = document.getElementById("ketqua");

    // Kiểm tra dữ liệu từ file data.js
    if (typeof duLieu === "undefined" || !duLieu[sbd]) {
        kq.innerHTML = "<p style='color:red'>Không tìm thấy số báo danh!</p>";
        taoCaptcha();
        return;
    }

    let ts = duLieu[sbd];
    
    // Đổ dữ liệu vào bảng có viền, xóa môn thừa và thêm môn chuyên
    kq.innerHTML = `
    <div style="padding-left:10px; margin-top:20px;">
        <p style="font-size:18px;"><b>Họ và tên:</b> ${ts.hoTen}</p><br>
        <p><b>Điểm các môn:</b></p><br>
        <table style="width:100%; border-collapse: collapse; text-align: center;" border="1" cellpadding="8">
            <tr style="background: #f5f5f5; font-weight: bold;">
                <td style="border: 1px solid #333;">Toán</td>
                <td style="border: 1px solid #333;">Ngữ văn</td>
                <td style="border: 1px solid #333;">Tiếng Anh</td>
                <td style="border: 1px solid #333;">Môn chuyên</td>
            </tr>
            <tr style="font-size:18px;">
                <td style="border: 1px solid #333;">${ts.diem ? ts.diem.toan : "-"}</td>
                <td style="border: 1px solid #333;">${ts.diem ? ts.diem.nguVan : "-"}</td>
                <td style="border: 1px solid #333;">${ts.diem ? ts.diem.tiengAnh : "-"}</td>
                <td style="border: 1px solid #333;">${(ts.diem && ts.diem.monChuyen !== null) ? ts.diem.monChuyen : "-"}</td>
            </tr>
        </table>
        <br>
        <p><i>Ghi chú: Dấu (*) thể hiện điểm thi sau phúc khảo</i>[cite: 1]</p>
    </div>`;

    // Tự động tạo mã xác nhận mới sau khi tra cứu thành công
    taoCaptcha();
    document.getElementById("captcha").value = "";
}

// Lệnh QUAN TRỌNG: Chạy tạo mã ngay khi trang vừa load xong
window.onload = function() {
    taoCaptcha();
};
</script>
