<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 Not Found — NosXLAB</title>
    <style>
        :root { --deep-space: #0a0a10; --surface: rgba(26, 26, 36, 0.7); --accent: #8b5cf6; --text-main: #ffffff; --text-dim: #9e9eb3; --border-dim: rgba(255, 255, 255, 0.08); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--deep-space); color: var(--text-main); margin: 0; display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 20px; }
        .auth-box { background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-dim); border-radius: 24px; padding: 60px 40px; width: 100%; max-width: 450px; box-sizing: border-box; }
        h1 { font-size: clamp(60px, 20vw, 100px); color: var(--accent); margin: 0; line-height: 1; }
        .btn-primary { display: inline-block; background: var(--accent); color: #fff; padding: 14px 32px; border-radius: 100px; text-decoration: none; font-weight: 700; margin-top: 24px; transition: 0.3s; }
        .btn-primary:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>404</h1>
        <h2 style="margin: 16px 0; font-size: 22px;">Trang không tồn tại</h2>
        <p style="color: var(--text-dim); font-size: 14px; line-height: 1.6;">Hệ thống không tìm thấy tài nguyên sếp yêu cầu. Có thể đường dẫn đã bị "bay màu".</p>
        <a href="../index.html" class="btn-primary">Về trang chủ</a>
    </div>
</body>
</html>
